services:
  - type: web
    name: internexis-backend
    env: node
    region: oregon
    plan: free
    rootDir: ./backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000      - key: CORS_ORIGIN
        value: https://internexis-technologies.in,https://www.internexis-technologies.in
      # Add MONGODB_URI and MONGO_URI manually in Render dashboard for security
    autoDeploy: true
