services:
  - type: web
    name: internexis-official
    env: node
    region: oregon
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add MONGODB_URI and MONGO_URI manually in Render dashboard for security
    autoDeploy: true
